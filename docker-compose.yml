services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: jobs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d jobs"]
      interval: 3s
      retries: 20

  adminer:
    image: adminer:4                      # database GUI at http://localhost:8080 (see README for the login)
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }

  rabbitmq:
    image: rabbitmq:3-management          # dashboard at http://localhost:15672 (guest / guest)
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  api:
    build: ./services/api
    command: node dist/entrypoints/api-server.js
    ports:
      - "3000:3000"                       # API + dashboard at http://localhost:3000
    environment: &app_env
      DATABASE_URL: postgres://app:app@postgres:5432/jobs
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATA_DIR: /data
      MAX_FAN_IN: "5"
    volumes:
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  scheduler:
    build: ./services/api                          # same TypeScript codebase, different entry point
    command: node dist/entrypoints/scheduler.js
    environment:
      <<: *app_env
      TICK_MS: "500"
      BACKUP_FACTOR: "${BACKUP_FACTOR:-2}"   # a task is "slow" if running > factor x median (set 100000 to disable)
    volumes:
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  workers:
    build: ./services/worker
    command: python -m distributed_mean.worker_manager   # keeps W worker processes running
    environment:
      <<: *app_env
      INITIAL_WORKERS: "${INITIAL_WORKERS:-3}"
      WORKER_SLOWDOWN: "${WORKER_SLOWDOWN:-1,1,3}"   # demo: 3rd worker is 3x slower (cycled by worker index)
      WORKER_MEMORY_MB: "512"             # simulated RAM cap per worker process (0 = off)
    volumes:
      - ./data:/data
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata: